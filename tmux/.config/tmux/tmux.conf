# .tmux.conf

# options
# set the terminal type to support 256 colours and true colours
%if "#{==:#{TMUX_SCREEN_TERM},1}"
    set-option -g default-terminal "screen-256color"
%else
    set-option -g default-terminal "tmux-256color"
%endif

%if "#{!=:#{TMUX_NO_TRUECOLOR},1}"
    set-option -as terminal-features ",xterm*:RGB"
    set-option -as terminal-features ",putty*:RGB"
    set-option -as terminal-features ",tmux*:RGB"
    set-option -as terminal-features ",screen*:RGB"
    set-option -as terminal-features ",alacritty*:RGB"
    set-option -as terminal-features ",wezterm*:RGB"
    set-option -as terminal-features ",kitty*:RGB"
    set-option -as terminal-features ",foot*:RGB"
    set-option -as terminal-features ",ghostty*:RGB"
    set-option -as terminal-features ",rxvt-unicode*:RGB"
%endif

# change the prefix to C-Space
set-option -g prefix C-Space
unbind-key -T prefix C-b
bind-key -T prefix C-Space send-prefix

# windows and panes start with index 1
set-option -g base-index 1
set-option -g pane-base-index 1

# word boundary definition
set-window-option -g word-separators ' `~!@#$%^&*()-+={}[]|;:",.<>/?'
set-window-option -ga word-separators "'"
set-window-option -ga word-separators \\

# scrollback buffer history
set-option -g history-limit 1000000

# send escape-key immediately to underlying application
set-option -s escape-time 0

# switch session on destroy of this session
set-option -g detach-on-destroy off

# don't allow rename of window using terminal escapes
set-window-option -g allow-rename off

# terminal focus events
set-option -g focus-events on

# update the terminal title
set-option -g set-titles on
set-option -g set-titles-string "#S:#I:#W - \"#T\" #{session_alerts}"

# enable bell
set-option -g monitor-bell on
set-option -g visual-bell off

# allow passthrough to outer terminal
set-option -g allow-passthrough on

# extended keys
set-option -s extended-keys on
set-option -as terminal-features ",xterm*:extkeys"

# key bindings
# vim key bindings for copy mode
set-window-option -g mode-keys vi

# reload the ~/.tmux.conf file
bind-key -T prefix R source-file ~/.config/tmux/tmux.conf \; display "~/.config/tmux/tmux.conf reloaded"

# copy mode
bind-key -T prefix y copy-mode
bind-key -T prefix Y copy-mode

# customize the vim key bindings in copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi / command-prompt -i -p "(search down)" "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "(search up)" "send -X search-backward-incremental \"%%%\""

# extend copy paste to system clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T prefix ] run "xclip -out -selection clipboard | tmux load-buffer - ; tmux paste-buffer"
bind-key -T prefix P run "xclip -out -selection clipboard | tmux load-buffer - ; tmux paste-buffer"

# window navigation
bind-key -T prefix -r n next-window
bind-key -T prefix -r p previous-window

# vim key bindings for pane traversal
bind-key -T prefix h select-pane -L
bind-key -T prefix j select-pane -D
bind-key -T prefix k select-pane -U
bind-key -T prefix l select-pane -R

# ^ used to switch to last-window
bind-key -T prefix -r C-^ last-window
bind-key -T prefix -r C-6 last-window

# resize the panes
bind-key -T prefix -r Left resize-pane -L
bind-key -T prefix -r Down resize-pane -D
bind-key -T prefix -r Up resize-pane -U
bind-key -T prefix -r Right resize-pane -R
bind-key -T prefix -r C-Left resize-pane -L 5
bind-key -T prefix -r C-Down resize-pane -D 5
bind-key -T prefix -r C-Up resize-pane -U 5
bind-key -T prefix -r C-Right resize-pane -R 5
bind-key -T prefix -r M-Left resize-pane -L 10
bind-key -T prefix -r M-Down resize-pane -D 10
bind-key -T prefix -r M-Up resize-pane -U 10
bind-key -T prefix -r M-Right resize-pane -R 10

# swap panes
bind-key -T prefix -r "{" swap-pane -U
bind-key -T prefix -r "}" swap-pane -D

# join pane to window
bind-key -T prefix J command-prompt -p "join current pane to window index:" "join-pane -t ':%%'"

# switch to window
bind-key -T prefix "'" command-prompt -p "switch to window index:" "select-window -t ':%%'"

# toggle sync panes
bind-key -T prefix b set-window-option synchronize-panes

# send command to all the panes in the current session
bind-key -T prefix B command-prompt -p "run command in this session:" "run \"tmux list-panes -s -F '##{session_name}:##{window_index}.##{pane_index}' | xargs -I PANE tmux send-keys -t PANE '%1' Enter\""

# unbind Space to <nop> - factory default to cycle layout
unbind-key -T prefix Space

# follow pane_current_path
bind-key -T prefix c new-window -c '#{pane_current_path}'
bind-key -T prefix % split-window -h -c '#{pane_current_path}'
bind-key -T prefix '"' split-window -v -c '#{pane_current_path}'

# new session
bind-key -T prefix S command-prompt -p "new session name:" "new-session -s \"%%%\""

# look and feel

# gruvbox dark
set-option -g @gruvbox_dark0_hard colour234
set-option -g @gruvbox_dark0 colour235
set-option -g @gruvbox_dark0_soft colour236
set-option -g @gruvbox_dark1 colour237
set-option -g @gruvbox_dark2 colour239
set-option -g @gruvbox_dark3 colour241
set-option -g @gruvbox_dark4 colour243
set-option -g @gruvbox_light0_hard colour230
set-option -g @gruvbox_light0 colour229
set-option -g @gruvbox_light0_soft colour228
set-option -g @gruvbox_light1 colour223
set-option -g @gruvbox_light2 colour250
set-option -g @gruvbox_light3 colour248
set-option -g @gruvbox_light4 colour246
set-option -g @gruvbox_gray_245 colour245
set-option -g @gruvbox_gray_244 colour244
set-option -g @gruvbox_bright_red colour167
set-option -g @gruvbox_bright_green colour142
set-option -g @gruvbox_bright_yellow colour214
set-option -g @gruvbox_bright_blue colour109
set-option -g @gruvbox_bright_purple colour175
set-option -g @gruvbox_bright_aqua colour108
set-option -g @gruvbox_bright_orange colour208
set-option -g @gruvbox_neutral_red colour124
set-option -g @gruvbox_neutral_green colour106
set-option -g @gruvbox_neutral_yellow colour172
set-option -g @gruvbox_neutral_blue colour66
set-option -g @gruvbox_neutral_purple colour132
set-option -g @gruvbox_neutral_aqua colour72
set-option -g @gruvbox_neutral_orange colour166
set-option -g @gruvbox_faded_red colour88
set-option -g @gruvbox_faded_green colour100
set-option -g @gruvbox_faded_yellow colour136
set-option -g @gruvbox_faded_blue colour24
set-option -g @gruvbox_faded_purple colour96
set-option -g @gruvbox_faded_aqua colour66
set-option -g @gruvbox_faded_orange colour130

# status bar
set-option -g status on
set-option -g status-interval 15
set-option -g status-justify left
set-option -g status-keys emacs
set-option -g status-left "#[fg=#{@gruvbox_light3},bg=#{@gruvbox_dark3}] #S #[fg=#{@gruvbox_dark3},bg=#{@gruvbox_dark1}] "
set-option -g status-left-length 50
set-option -g status-left-style default
set-option -g status-position bottom
set-option -g status-right "#[fg=#{@gruvbox_dark0},bg=#{@gruvbox_bright_red}]#(,tmux-session-alerts)"
set-option -ga status-right "#[fg=#{@gruvbox_light4},bg=#{@gruvbox_dark2}] #{?client_prefix,#[fg=#{@gruvbox_bright_yellow}]wait,#{?pane_in_mode,#[fg=#{@gruvbox_bright_yellow}]copy,#{?window_zoomed_flag,#[fg=#{@gruvbox_bright_yellow}]zoom,#{?pane_synchronized,#[fg=#{@gruvbox_bright_yellow}]sync,tmux}}}} "
set-option -ga status-right "#[fg=#{@gruvbox_dark1},bg=#{@gruvbox_light3}] %a %F %R %Z "
set-option -g status-right-length 50
set-option -g status-right-style default
set-option -g status-style "fg=#{@gruvbox_light1},bg=#{@gruvbox_dark1}"

# window title colours
set-window-option -g window-status-style "fg=#{@gruvbox_light1},bg=#{@gruvbox_dark2}"
set-window-option -g window-status-activity-style "fg=#{@gruvbox_light3},bg=#{@gruvbox_dark1}"

# active window title colours
set-window-option -g window-status-current-style "fg=#{@gruvbox_dark2},bg=#{@gruvbox_bright_yellow}"

# pane borders
set-window-option -g pane-border-style "fg=#{@gruvbox_dark1}"
set-window-option -g pane-active-border-style "fg=#{@gruvbox_light2}"

# message info
set-option -g message-style "fg=#{@gruvbox_light1},bg=#{@gruvbox_dark2}"

# writing commands inactive
set-option -g message-command-style "fg=#{@gruvbox_light1},bg=#{@gruvbox_dark2}"

# pane number display
set-option -gF display-panes-active-colour "#{@gruvbox_light2}"
set-option -gF display-panes-colour "#{@gruvbox_dark1}"

# clock
set-window-option -gF clock-mode-colour "#{@gruvbox_bright_blue}"

# bell alert
set-window-option -g window-status-bell-style "fg=#{@gruvbox_dark0},bg=#{@gruvbox_bright_red}"

# window status
set-window-option -g window-status-current-format " #I:#W#{?window_flags,#{window_flags}, } "
set-window-option -g window-status-format " #I:#W#{?window_flags,#{window_flags}, } "

# sesh
bind-key -T prefix T run-shell "sesh connect \"$(
  sesh list --icons | fzf --tmux 80%,80% \
    --ansi \
    --no-sort \
    --border-label ' sesh ' \
    --prompt '⚡  ' \
    --header '  ^a all ^s tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-s:change-prompt(🪟  )+reload(sesh list --tmux --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list --config --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list --zoxide --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd --type d --hidden --follow --exclude .git . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:50%' \
    --preview 'sesh preview {}'
)\""

# start main session
new-session -s main -d
